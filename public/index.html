<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus Oil Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1020">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{color-scheme:dark;--bg:#0a1020;--card:#111a2e;--ink:#e6edf7;--mut:#8da0bd;--line:#223150;--cy:#22d3ee;--grn:#34d399;--amb:#fbbf24;--red:#f87171}
  *{box-sizing:border-box}
  body{font-family:"Noto Sans Tamil","Segoe UI",Arial,sans-serif;margin:0;color:var(--ink);background:radial-gradient(900px 400px at 85% -10%,#12315a 0,transparent 70%),var(--bg);min-height:100vh}
  .wrap{max-width:980px;margin:auto;padding:14px}
  .hero{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,#12315a,#0e4a6b 60%,#0b6b7a);border:1px solid #2b4a75;border-radius:20px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 0 40px #22d3ee22}
  .hero h1{margin:2px 0 0;font-size:clamp(18px,4.6vw,28px);line-height:1.25;letter-spacing:.5px}
  .hero p{margin:2px 0 0;color:var(--cy);letter-spacing:4px;font-size:12px}
  .greet{font-size:13px;color:#bfe9f5}
  .alert{display:inline-block;margin-top:12px;background:#00000040;border:1px solid #ffffff2a;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
  .health{text-align:center;font-size:11px;color:#bfe9f5}
  .health svg{width:104px;height:104px}
  .road{position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,#ffffff55 0 14px,transparent 14px 28px)}
  .road span{position:absolute;bottom:3px;font-size:20px;filter:drop-shadow(0 0 6px var(--cy));animation:drive 10s linear infinite}
  @keyframes drive{from{left:-30px}to{left:100%}}
  @media (prefers-reduced-motion:reduce){.road span{animation:none;left:10px}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  h2.t{margin:0 0 12px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.5px}
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  button.bus{display:flex;gap:10px;align-items:center;text-align:left;background:#0d1626;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:10px;transition:.15s;font-weight:400}
  button.bus:hover{transform:translateY(-2px);border-color:var(--cy)}
  button.bus.on{border-color:var(--cy);box-shadow:0 0 0 2px #22d3ee44,0 0 18px #22d3ee33;background:#10213a}
  .ring{width:58px;height:58px;flex:none}
  .ring circle{fill:none;stroke-width:7}.ring .bg{stroke:#22304a}
  .ring .fg{stroke:#475569;stroke-linecap:round;transform:rotate(-90deg);transform-origin:32px 32px;transition:stroke-dasharray .8s}
  .ring text{fill:var(--ink);font-size:17px;font-weight:700}
  .grn .fg{stroke:var(--grn)}.amb .fg{stroke:var(--amb)}.red .fg{stroke:var(--red);filter:drop-shadow(0 0 4px var(--red))}
  .bi{display:flex;flex-direction:column;gap:4px;min-width:0}
  .bi b{font-size:13px;white-space:nowrap}.bi small{color:var(--mut);font-size:11px}
  .odo{display:flex;gap:2px}.odo i{font-style:normal;font:700 13px ui-monospace,Consolas,monospace;background:#000;color:#fde68a;border:1px solid #3b4a63;border-radius:3px;padding:1px 4px}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .hint{grid-column:1/-1;color:var(--cy);font-size:13px;min-height:16px}
  label{font-size:13px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;gap:5px}
  input,select{padding:10px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:#0d1626;color:var(--ink);font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px #22d3ee2a}
  button{padding:11px 16px;font-size:15px;font-weight:700;border:0;border-radius:10px;background:linear-gradient(135deg,#0891b2,#22d3ee);color:#04202a;cursor:pointer;font-family:inherit}
  button.g{background:linear-gradient(135deg,#059669,#34d399)} button.c{background:#475569;color:#fff}
  button.e{background:var(--amb);padding:5px 9px;font-size:12px;margin-right:4px} button.x{background:var(--red);padding:5px 9px;font-size:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar label{flex-direction:row;align-items:center}
  .scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px;text-align:right;border-bottom:1px solid var(--line)}
  th{background:#16243d;color:var(--cy);font-size:13px;white-space:nowrap}
  tbody tr:nth-child(even){background:#0e172a}tbody tr:hover{background:#15264a}
  td:first-child,th:first-child,td.n,th.n{text-align:left}td:first-child{white-space:nowrap}
  .chip{background:#0b3a4a;color:var(--cy);padding:3px 9px;border-radius:99px;font-weight:700;font-size:12px;white-space:nowrap;border:1px solid #155e75}
  .empty{padding:24px;text-align:center;color:var(--mut)}
  .ph{display:none}
  @media print{
    :root{color-scheme:light;--ink:#000;--mut:#333;--line:#999}
    body{background:#fff}.noprint,.road,.alert,.health,.greet{display:none!important}
    .hero{background:none;border:0;box-shadow:none;padding:0}.hero p{color:#000}.card{background:#fff;border:0;padding:0}
    .scroll{border:0}.ph{display:block}th{background:#eee;color:#000}tbody tr:nth-child(even){background:none}.chip{background:none;color:#000;border:0;padding:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <div class="greet noprint" id="greet"></div>
      <h1>🚌 SHRI HARI VELMURUGAN TRANSPORT</h1>
      <p>AMBASAMUDRAM</p>
    </div>
    <div class="health noprint" id="health"></div>
    <div class="road noprint"><span>🚌</span></div>
  </div>

  <div class="card noprint">
    <h2 class="t">⛽ OIL STATUS BOARD · bus mela click panna andha bus entries mattum varum</h2>
    <div class="board" id="board"></div>
  </div>

  <div class="card noprint">
    <form id="f">
      <label>Date <input type="date" id="date" required></label>
      <label>பேருந்து எண் <select id="bus" required></select></label>
      <label>Km (கி.மீ) <input type="number" id="km" step="0.1" min="0" required></label>
      <label>Oil (லிட்டர்கள்) <input type="number" id="litres" step="0.01" min="0" required></label>
      <label>TierNo (டயர் எண்) (optional) <input type="text" id="tierno"></label>
      <label>Note (optional) <input type="text" id="note"></label>
      <small class="hint" id="hint"></small>
      <label>&nbsp;<span style="display:flex;gap:6px"><button type="submit" id="saveBtn">➕ Save</button><button type="button" id="cancelBtn" class="c" style="display:none" onclick="cancelEdit()">✖ Cancel</button></span></label>
    </form>
  </div>

  <div class="card" id="tbl">
    <div class="bar noprint">
      <label>Bus: <select id="filter" onchange="render()" style="margin-left:6px"></select></label>
      <button onclick="window.print()">🖨️ Print / PDF</button>
      <button class="g" onclick="downloadCSV()">⬇️ Download (Excel)</button>
    </div>
    <div class="ph"><h2>Bus Oil Report - <span id="phBus"></span></h2></div>
    <div class="scroll">
    <table>
      <thead><tr><th>Date</th><th class="n">Bus</th><th>Km</th><th>Oil (L)</th><th class="n">Tyre No</th><th class="n">Note</th><th class="noprint"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">Entry onnum illa</div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
// ===== Bus numbers inga maathikkalaam =====
const BUSES = ['TN76 AV8933','TN76 AV8934','TN76 AV8973','TN76 AV8974','TN72 BZ0662','TN72 BP6485','TN76 AV8957','TN76 AV8959','TN72 BZ5965(BS6)T','TN 72 BZ5091(BS6)E'];
const WARN_DAYS = 60, ALERT_DAYS = 90;   // evlo naal aana amber / red nu maathikkalaam
let data = [], editId = null;
$('date').valueAsDate = new Date();

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d.split('-').reverse().join('-');
const days = d => Math.round((new Date().setHours(0,0,0,0) - new Date(d + 'T00:00:00')) / 864e5);
function ring(n, f, R, C) {
  return `<svg viewBox="0 0 64 64" class="ring"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" cx="32" cy="32" r="26" style="stroke-dasharray:${(f * 163.4).toFixed(1)} 163.4"/></svg>`;
}
function renderBoard() {
  let due = 0, ok = 0, rec = 0;
  $('board').innerHTML = BUSES.map((b, i) => {
    const e = data.find(x => x.bus === b); let cls = '', n = '–', f = 0, sub = 'No record', odo = '';
    if (e) { const d = days(e.date); rec++; cls = d >= ALERT_DAYS ? 'red' : d >= WARN_DAYS ? 'amb' : 'grn';
      if (cls === 'red') due++; else ok++;
      n = Math.max(d, 0); f = Math.min(Math.max(d, 0) / ALERT_DAYS, 1); sub = '';
      odo = '<div class="odo">' + String(Math.round(e.km)).split('').map(c => `<i>${c}</i>`).join('') + '</div>'; }
    return `<button type="button" class="bus ${cls}${$('filter').value === b ? ' on' : ''}" onclick="pick(${i})">${ring(n, f)}<div class="bi"><b>${esc(b)}</b>${odo}${sub ? `<small>${sub}</small>` : ''}</div></button>`;
  }).join('');
  const pct = rec ? Math.round(100 * ok / rec) : 0, col = !rec ? '#475569' : pct >= 80 ? '#34d399' : pct >= 50 ? '#fbbf24' : '#f87171';
  $('health').innerHTML = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff22" stroke-width="9"/><circle cx="50" cy="50" r="40" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" style="stroke-dasharray:${(2.513 * pct).toFixed(1)} 251.3;transform:rotate(-90deg);transform-origin:50px 50px;transition:stroke-dasharray .9s"/><text x="50" y="56" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">${rec ? pct + '%' : '—'}</text></svg>Fleet Health`;
}
function hint() {
  const b = $('bus').value, e = data.find(x => x.bus === b);
  $('hint').textContent = !b ? '' : e ? `💡 கடைசி பதிவு: ${fmt(e.date)} · ${e.km} km${e.tierno ? ' · Tyre ' + e.tierno : ''}` : '💡 Indha bus ku munnadi entry illa';
}
$('bus').onchange = hint;
const hr = new Date().getHours();
$('greet').textContent = (hr < 12 ? 'காலை வணக்கம்' : hr < 17 ? 'மதிய வணக்கம்' : 'மாலை வணக்கம்') + ' 👋';
function pick(i) {
  $('filter').value = $('filter').value === BUSES[i] ? '' : BUSES[i];
  render(); $('tbl').scrollIntoView({ behavior: 'smooth' });
}
const shown = () => data.filter(e => !$('filter').value || e.bus === $('filter').value);

function loadBuses() {
  const opts = BUSES.map(b => `<option>${esc(b)}</option>`).join('');
  $('bus').innerHTML = '<option value="">-- Select --</option>' + opts;
  $('filter').innerHTML = '<option value="">All Buses</option>' + opts;
}

async function load() {
  try { data = await (await fetch('/api/entries')).json(); } catch { alert('Server connect aagala'); }
  render();
}
function render() {
  const list = shown();
  renderBoard(); hint(); $('empty').style.display = list.length ? 'none' : '';
  $('phBus').textContent = $('filter').value || 'All Buses';
  $('rows').innerHTML = list.map(e => `<tr>
    <td>${fmt(e.date)}</td><td class="n"><span class="chip">${esc(e.bus || '-')}</span></td><td>${e.km}</td><td>${e.litres}</td>
    <td class="n">${esc(e.tierno || '')}</td><td class="n">${esc(e.note || '')}</td>
    <td class="noprint" style="white-space:nowrap"><button class="e" onclick="edit('${e._id}')">✏️</button><button class="x" onclick="del('${e._id}')">✕</button></td></tr>`).join('');
}
$('f').onsubmit = async ev => {
  ev.preventDefault();
  const body = { date: $('date').value, bus: $('bus').value, km: +$('km').value, litres: +$('litres').value, tierno: $('tierno').value, note: $('note').value };
  if (!editId) { const last = data.find(x => x.bus === body.bus);
    if (last && body.km < last.km && !confirm(`Km (${body.km}) kadaisi pathivu (${last.km}) vida kuraivaa irukku. Save pannanuma?`)) return; }
  const r = await fetch(editId ? '/api/entries/' + editId : '/api/entries', { method: editId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) return alert('Save aagala');
  cancelEdit();
  load();
};
function edit(id) {
  const e = data.find(x => x._id === id); if (!e) return;
  editId = id;
  $('date').value = e.date; $('bus').value = e.bus || ''; $('km').value = e.km; $('litres').value = e.litres;
  $('tierno').value = e.tierno || ''; $('note').value = e.note || '';
  $('saveBtn').textContent = '✔ Update'; $('cancelBtn').style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function cancelEdit() {
  editId = null;
  ['km', 'litres', 'tierno', 'note'].forEach(i => $(i).value = '');
  $('date').valueAsDate = new Date();
  $('saveBtn').textContent = '➕ Save'; $('cancelBtn').style.display = 'none';
}
async function del(id) {
  if (!confirm('Delete pannanuma?')) return;
  await fetch('/api/entries/' + id, { method: 'DELETE' }); load();
}
function downloadCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Date', 'Bus', 'Km', 'Oil (L)', 'Tyre No', 'Note'],
    ...shown().map(e => [fmt(e.date), q(e.bus), e.km, e.litres, q(e.tierno), q(e.note)])];
  const blob = new Blob(['\ufeff' + rows.map(r => r.join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'bus-oil-log.csv'; a.click();
}
loadBuses();
load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
